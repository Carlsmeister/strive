name: iOS

# macOS minutes count ten times Linux minutes against the monthly quota, so this runs only towards main.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    name: iOS simulator tests and build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - run: ./gradlew :shared:iosSimulatorArm64Test
      # Unsigned: the free Apple ID signs only on Carl's Mac (ADR 0001).
      - run: >
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp
          -destination 'generic/platform=iOS Simulator' -derivedDataPath build/xcode
          CODE_SIGNING_ALLOWED=NO build