name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Shared tests, Android build, lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          # The default provider is commercial; basic is MIT and free for private repositories.
          cache-provider: basic
      # Tokens.kt, tokens.css and tokens.json are generated; a hand edit or a stale file fails here (#30).
      - run: python3 docs/design/15-tokens/tokens.py && git status --porcelain && test -z "$(git status --porcelain)"
      - run: ./gradlew :shared:testAndroidHostTest :androidApp:assembleDebug lint
      # Report only, no minimum, until #4 (#32). Covers commonMain and androidMain, never iosMain.
      - run: ./gradlew -q :shared:koverHtmlReport :shared:koverXmlReport :shared:koverLog | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: shared/build/reports/kover/