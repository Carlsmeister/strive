<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flyover playing</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/strive1/tokens.css">
<link rel="stylesheet" href="ds/strive1/components/bundle.css">
<link rel="stylesheet" href="moments.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div class="strive screen" data-theme="{{mode}}">
<div class="map" style="position:absolute;inset:0"><div class="tilt" style="position:absolute;inset:0"><img class="only-dark" src="/_blob/5f81896c79487b24b7f6d5ced01a2a9a" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"><img class="only-light" src="/_blob/13891c6b0a0ded6ca4836d993f759c2f" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"><img src="/_blob/49cb24d17f0497975f2b8a64713d9ee8" alt="Route" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"><span class="you" style="left:326px;top:396px" aria-label="You at 4.10 km"></span></div></div>
<div class="mapctl glass" style="top:62px;left:16px"><a class="mapbtn" href="RU-05-done.dc.html" aria-label="Close map"><span class="ic ic-x s22"></span></a></div>
<div class="glass" style="position:absolute;z-index:2;top:62px;left:76px;right:16px;border-radius:16px;padding:0 4px">
<div class="runstats"><div><b style="font-size:22px;line-height:28px">10.6</b><small>km/h</small></div><div><b style="font-size:22px;line-height:28px">22</b><small>elevation m</small></div><div><b style="font-size:22px;line-height:28px">4.10</b><small>km</small></div></div>
</div>
<div class="glass thick" style="position:absolute;z-index:2;left:16px;right:16px;bottom:40px;border-radius:28px;padding:12px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center">
<a class="ibtn on" href="RU-08-paused.dc.html" aria-label="Pause"><span class="ic ic-pause-f s22"></span></a>
<div style="display:grid;gap:6px">
<div style="position:relative;height:22px;display:grid;align-items:center" role="slider" aria-label="Position along the route" aria-valuetext="4.10 of 8.04 km">

<span style="height:4px;border-radius:999px;background:var(--color-outline-variant)"></span>
<span style="position:absolute;left:0;width:51%;height:4px;border-radius:999px;background:var(--color-primary)"></span>
<span style="position:absolute;left:calc(51% - 11px);width:22px;height:22px;border-radius:50%;background:var(--color-primary);box-shadow:var(--material-shadow)"></span>
</div>
<div class="between" style="font:var(--type-label-medium);color:var(--color-on-surface-variant)"><span>0 km</span><span>8.04 km</span></div>
</div>
<span class="btn small" style="min-height:44px;min-width:52px;padding:0 12px">1x</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark-hc","dark","light","light-hc"],"default":"dark-hc"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { mode: this.props.mode ?? 'dark-hc' };
  }
}
</script>
</body>
</html>
