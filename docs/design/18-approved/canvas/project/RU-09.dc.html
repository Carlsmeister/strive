<main class="body" style="padding-top:16px">
<div class="group"><h4>Title</h4><div class="field"><span class="in">Long run</span><span class="ic ic-clear s18"></span></div></div>

<div class="row"><span>Device</span><span class="val">iPhone</span></div>
</div><p class="foot">Distance and time come from the recording and cannot be edited.</p></div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark-hc","dark","light","light-hc"],"default":"dark-hc"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { mode: this.props.mode ?? 'dark-hc' };
  }
}
</script>
