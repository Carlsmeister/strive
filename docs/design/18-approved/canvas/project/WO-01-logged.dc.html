<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Empty workout, all logged</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/strive1/tokens.css">
<link rel="stylesheet" href="ds/strive1/components/bundle.css">
<link rel="stylesheet" href="moments.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div class="strive screen" data-theme="{{mode}}">
<div class="safe"></div>
<header class="wtb">
<div class="l">
<a class="ibtn plain" href="SH-02-inprog.dc.html" aria-label="Minimise workout"><span class="ic ic-down s22"></span></a>
<a class="ibtn" href="WO-07-menu.dc.html" aria-label="Free rest"><span class="ic ic-timer s20"></span></a>
</div>
<div class="mid"></div>
<a class="finish all" href="WO-21-empty.dc.html">Finish</a>
</header>
<main class="body">
<section class="whead">
<div class="name">Workout <a class="pill" href="WO-08-menu.dc.html" aria-label="Workout options">⋯</a></div>
<div class="meta">
<span><span class="ic ic-calendar s16"></span>Mon 9 Nov</span>
<span class="clock"><span class="ic ic-clock s16 muted"></span>31:40</span>
<span>3 of 3 sets</span>
</div>
</section>
<section class="ov" style="flex: none" aria-label="Exercises">
<div class="ovrow">
<div class="grow"><div class="nm">Bench Press BB</div><div class="dots"><i class="w"></i><i class="on"></i><i class="on"></i><i class="on"></i></div></div>
<span class="cnt all">4/4 <span class="ic ic-check s14"></span></span><span class="exp"><span class="ic ic-down s14"></span></span>
</div>
</section>
<div class="vstack" style="padding-top: 12px">
<button class="addbig"><span class="plus">+</span>Add exercises</button>
<button class="discard">Discard workout</button>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark-hc","dark","light","light-hc"],"default":"dark-hc"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { mode: this.props.mode ?? 'dark-hc' };
  }
}
</script>
</body>
</html>
