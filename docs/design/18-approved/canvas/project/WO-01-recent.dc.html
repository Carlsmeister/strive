<!doctype html>

<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div class="strive screen" data-theme="{{mode}}">
<div class="safe"></div>
<header class="wtb">
<div class="l">
<a class="ibtn plain" href="SH-02-inprog.dc.html" aria-label="Minimise workout"><span class="ic ic-down s22"></span></a>
<a class="ibtn" href="WO-07-menu.dc.html" aria-label="Free rest"><span class="ic ic-timer s20"></span></a>
</div>
<div class="mid"><span class="wn">Workout <a class="pill" href="WO-08-menu.dc.html" aria-label="Workout options">⋯</a></span><small>0:12</small></div>
<a class="finish" href="WO-16-empty.dc.html">Finish</a>
</header>
<main class="body">
<section class="qs" style="margin-top: 8px">
<span class="mark"><span class="ic ic-plus s32"></span></span>
<h2>What are you training today?</h2>
<p>Pick from the library, or tap an exercise below.</p>
<a class="btn filled" href="EX-03-none.dc.html">Add exercises</a>
</section>
<section class="vstack" style="gap: 12px; padding-top: 8px" aria-label="Quick picks">
<div class="between" style="align-items: baseline"><h2 style="font: var(--type-title-small)">Quick picks</h2><span class="cap">Recently done</span></div>
<div class="chipwrap">
<button class="chip qp" aria-label="Add Curl DB"><span class="plus">+</span>Curl DB</button>
<button class="chip qp" aria-label="Add Hammer Curl DB"><span class="plus">+</span>Hammer Curl DB</button>
<button class="chip qp" aria-label="Add Tricep Pushdown"><span class="plus">+</span>Tricep Pushdown</button>
<button class="chip qp" aria-label="Add Deadlift BB"><span class="plus">+</span>Deadlift BB</button>
<button class="chip qp" aria-label="Add Lat Pulldown Cable"><span class="plus">+</span>Lat Pulldown Cable</button>
<button class="chip qp" aria-label="Add Seated Row Cable"><span class="plus">+</span>Seated Row Cable</button>
</div>
</section>
<a class="discard" href="WO-16-discard.dc.html">Discard workout</a>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark-hc","dark","light","light-hc"],"default":"dark-hc"},"$preview":{"width":390,"height":844}}'>

  renderVals() {
    return { mode: this.props.mode ?? 'dark-hc' };
  }
}
</script>
