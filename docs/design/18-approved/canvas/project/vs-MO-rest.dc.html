<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>1 vs 1+2 · MO · the rest timer ending</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/strive1/tokens.css">
<link rel="stylesheet" href="ds/strive1/components/bundle.css">
<link rel="stylesheet" href="moments.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&amp;display=swap">
</helmet>
<div class="strive" data-theme="{{mode}}" style="width: 2648px; height: 894px; box-sizing: border-box; padding: 24px; background: var(--color-surface-container-low); color: var(--color-on-surface); display: flex; gap: 40px">
<figure style="margin: 0; display: grid; gap: 10px; align-content: start; width: 1280px"><figcaption class="cap" style="font-weight: 600; height: 36px; line-height: 18px; overflow: hidden">Strive 1 · MO · the rest timer ending</figcaption><div style="width: 1280px; height: 800px; position: relative; overflow: hidden">
<div class="strive" data-theme="{{mode}}" style="width: 1280px; height: 800px; box-sizing: border-box; padding: 40px 48px; background: var(--color-background); color: var(--color-on-surface); display: flex; flex-direction: column; gap: 28px">
<header style="display: flex; justify-content: space-between; align-items: baseline">
<h1 style="font: 700 34px/41px var(--font-family)">The rest timer ending</h1>
<p class="muted" style="font: var(--type-body-medium)">Seconds left on the card. The digits never animate; only the ring and the colour do.</p>
</header>

<section style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px" aria-label="Key frames">
<figure style="margin: 0; display: grid; gap: 10px">
<figcaption class="cap">1:43 · counting, amber ring, − 15 s + and Skip</figcaption>
<div class="glass thick" style="border-radius: 16px; padding: 16px; display: grid; gap: 12px">
<div style="display: flex; align-items: center; gap: 16px"><div class="ring"><svg viewBox="0 0 64 64" aria-hidden="true"><circle class="track" cx="32" cy="32" r="23.5" stroke-width="6.4"></circle><circle class="prog" cx="32" cy="32" r="23.5" stroke-width="6.4" stroke-dasharray="147.65" stroke-dashoffset="20.9"></circle></svg></div><div><div class="restcard-k cap" style="font: var(--type-title-small); color: var(--color-on-surface-variant)">Rest</div><div style="font: var(--type-display-small)">1:43</div></div></div>
<div style="display: flex; align-items: center; gap: 8px"><span class="roundk">−</span><span class="cap">15 s</span><span class="roundk">+</span><span class="skipk" style="margin-left: auto">Skip</span></div>
</div>
</figure>
<figure style="margin: 0; display: grid; gap: 10px">
<figcaption class="cap">0:03 · the last three seconds turn teal</figcaption>
<div class="glass thick" style="border-radius: 16px; padding: 16px; display: grid; gap: 12px">
<div style="display: flex; align-items: center; gap: 16px"><div class="ring"><svg viewBox="0 0 64 64" aria-hidden="true"><circle class="track" cx="32" cy="32" r="23.5" stroke-width="6.4"></circle><circle class="prog" cx="32" cy="32" r="23.5" stroke-width="6.4" stroke-dasharray="147.65" stroke-dashoffset="143.9" style="stroke: var(--color-primary)"></circle></svg></div><div><div style="font: var(--type-title-small); color: var(--color-on-surface-variant)">Rest</div><div style="font: var(--type-display-small); color: var(--color-primary)">0:03</div></div></div>
<div style="display: flex; align-items: center; gap: 8px"><span class="roundk">−</span><span class="cap">15 s</span><span class="roundk">+</span><span class="skipk" style="margin-left: auto">Skip</span></div>
</div>
</figure>
<figure style="margin: 0; display: grid; gap: 10px">
<figcaption class="cap">0:00 · sound, long buzz, the ring closes teal</figcaption>
<div class="glass thick" style="border-radius: 16px; padding: 16px; display: grid; gap: 12px">
<div style="display: flex; align-items: center; gap: 16px"><div class="ring done"><svg viewBox="0 0 64 64" aria-hidden="true"><circle class="track" cx="32" cy="32" r="23.5" stroke-width="6.4"></circle><circle class="prog" cx="32" cy="32" r="23.5" stroke-width="6.4" stroke-dasharray="147.65" stroke-dashoffset="0"></circle></svg></div><div><div style="font: var(--type-title-small); color: var(--color-on-surface-variant)">Rest over</div><div style="font: var(--type-title-medium)">Set 3 next · 80 × 7</div></div></div>
</div>
</figure>
<figure style="margin: 0; display: grid; gap: 10px">
<figcaption class="cap">+250 ms · the card settles 8 pt and fades</figcaption>
<div class="glass thick" style="border-radius: 16px; padding: 16px; display: grid; gap: 12px; opacity: .35; transform: translateY(8px)">
<div style="display: flex; align-items: center; gap: 16px"><div class="ring done"><svg viewBox="0 0 64 64" aria-hidden="true"><circle class="track" cx="32" cy="32" r="23.5" stroke-width="6.4"></circle><circle class="prog" cx="32" cy="32" r="23.5" stroke-width="6.4" stroke-dasharray="147.65" stroke-dashoffset="0"></circle></svg></div><div><div style="font: var(--type-title-small); color: var(--color-on-surface-variant)">Rest over</div><div style="font: var(--type-title-medium)">Set 3 next · 80 × 7</div></div></div>
</div>
</figure>
</section>

<section aria-label="Rules" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px">
<div class="card" style="gap: 8px"><h2 class="title-medium">Counting</h2><p class="muted" style="font: var(--type-body-medium)">The ring drains in 1 s linear ticks (motion-tick). − and + change the total by 15 s; the ring springs to its new share (release spring 350). Skip ends the rest at once: the card fades (250) without the buzz.</p></div>
<div class="card" style="gap: 8px"><h2 class="title-medium">Ending</h2><p class="muted" style="font: var(--type-body-medium)">At 3 s the ring and digits cross-fade to teal (250). At 0: a sound and a long buzz, the ring closes teal and the label reads "Rest over · Set 3 next", held 600 ms, then the card settles 8 pt and fades (250). The list never scrolls by itself.</p></div>
<div class="card" style="gap: 8px"><h2 class="title-medium">Elsewhere</h2><p class="muted" style="font: var(--type-body-medium)">Minimised: the bar's small ring ticks the same way and flashes teal at 0. Locked: the Live Activity counts with the system timer and a notification fires at 0 (WO-18, WO-19). Reduce Motion: only the digits change; the ring jumps; the card simply disappears.</p></div>
</section>
</div>
</div></figure>
<figure style="margin: 0; display: grid; gap: 10px; align-content: start; width: 1280px"><figcaption class="cap" style="height: 36px; line-height: 18px; overflow: hidden" title="the last 3 s pulse; at 0:00 ring and edge pop lime, hold 600 ms, then leave calm"><b>Strive 1+2</b> · the last 3 s pulse; at 0:00 ring and edge pop lime, hold 600 ms, then leave calm</figcaption><dc-import name="MO-rest" mode="{{mode}}" hint-size="1280px,800px"></dc-import></figure>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark-hc","dark","light","light-hc"],"default":"dark-hc"},"$preview":{"width":2648,"height":894}}'>
class Component extends DCLogic {
  renderVals() {
    return { mode: this.props.mode ?? 'dark-hc' };
  }
}
</script>
</body>
</html>
