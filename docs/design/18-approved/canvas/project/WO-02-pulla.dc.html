<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pull A · started</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/strive1/tokens.css">
<link rel="stylesheet" href="ds/strive1/components/bundle.css">
<link rel="stylesheet" href="moments.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div class="strive screen" data-theme="{{mode}}">
<div class="safe"></div>
<header class="wtb">
<div class="l">
<a class="ibtn plain" href="SH-02-inprog.dc.html" aria-label="Minimise workout"><span class="ic ic-down s22"></span></a>
<a class="ibtn" href="WO-07-menu.dc.html" aria-label="Free rest"><span class="ic ic-timer s20"></span></a>
</div>
<div class="mid"></div>
<a class="finish" href="WO-15-several.dc.html">Finish</a>
</header>
<main class="body">
<section class="whead">
<div class="name">Pull A <a class="pill" href="WO-08-menu.dc.html" aria-label="Workout options">⋯</a></div>
<div class="meta">
<span><span class="ic ic-calendar s16"></span>Mon 9 Nov</span>
<span class="clock"><span class="ic ic-clock s16 muted"></span>0:06</span>
<span>0 of 12 sets</span>
</div>
</section>
<section class="focus" aria-label="Next set">
<p class="now">Now · Deadlift BB · <span class="k-warm">Warm-up</span></p>
<div>
<div class="fvals"><span class="fv">60</span><span class="fu">kg</span><span class="fx">×</span><span class="fv">5</span><span class="fu">reps</span></div>
<div class="fmeta"><span>rest 2:00 after</span><span>Previous <b>60 × 5</b></span></div>
</div>
<div class="seg compact" role="group" aria-label="RIR">
<button>0</button><button>1</button><button>2</button><button>3</button><button>4+</button>
</div>
<div class="facts">
<button class="fbtn">Edit</button>
<button class="fbtn log"><span class="ic ic-check s20"></span>Log warm-up</button>
</div>
</section>
<section aria-label="Deadlift BB">
<div class="exh">
<div class="top">
<button class="nm">Deadlift BB</button>
<button class="pill" aria-label="Exercise options">⋯</button>
<button class="fold" aria-label="Fold Deadlift BB"><span class="ic ic-up s14"></span></button>
</div>
</div>
<div class="cols"><span class="c-set">Set</span><span class="c-prev">Previous</span><span class="c-w">kg</span><span class="c-r">Reps</span><span class="c-ok">✓</span></div>
<div class="srow next">
<button class="badge w" style="background: var(--color-tertiary); color: var(--color-on-tertiary)" aria-label="Set type: warm-up">W</button>
<span class="sprev">60 × 5</span>
<button class="cell w">60</button><button class="cell r">5</button>
<button class="ok" aria-label="Log set W"><span class="ic ic-check s18"></span></button>
</div>
<div class="pline">
<svg class="sleeve" viewBox="0 0 64 40" aria-hidden="true"><rect class="shaft" x="0" y="18" width="64" height="4" rx="1"></rect><rect class="collar" x="4" y="12" width="4" height="16" rx="1"></rect><rect class="plate" x="10" y="4" width="6" height="32" rx="1.5"></rect></svg>
<span>20 per side</span>
</div>
<span class="restl">Rest 2:00</span>
<div class="srow">
<button class="badge" aria-label="Set type: set 1">1</button>
<span class="sprev">125 × 5 @2</span>
<button class="cell w">127.5</button><button class="cell r">5</button>
<button class="ok" aria-label="Log set 1"><span class="ic ic-check s18"></span></button>
</div>
<span class="restl">Rest 2:00</span>
<div class="srow">
<button class="badge" aria-label="Set type: set 2">2</button>
<span class="sprev">127.5 × 5 @2</span>
<button class="cell w">127.5</button><button class="cell r">5</button>
<button class="ok" aria-label="Log set 2"><span class="ic ic-check s18"></span></button>
</div>
<span class="restl">Rest 2:00</span>
<div class="srow">
<button class="badge" aria-label="Set type: set 3">3</button>
<span class="sprev">127.5 × 5 @1</span>
<button class="cell w">127.5</button><button class="cell r">5</button>
<button class="ok" aria-label="Log set 3"><span class="ic ic-check s18"></span></button>
</div>
<button class="addset"><span class="plus">+</span>Add set (2:00)</button>
</section>
<section class="ov" style="flex: none" aria-label="Coming exercises">
<div class="ovrow">
<div class="grow"><div class="nm">Lat Pulldown Cable</div><div class="dots"><i></i><i></i><i></i></div></div>
<span class="cnt">0/3</span><span class="exp"><span class="ic ic-down s14"></span></span>
</div>
<div class="ovrow">
<div class="grow"><div class="nm">Seated Row Cable</div><div class="dots"><i></i><i></i><i></i></div></div>
<span class="cnt">0/3</span><span class="exp"><span class="ic ic-down s14"></span></span>
</div>
<div class="ovrow">
<div class="grow"><div class="nm">Curl DB</div><div class="dots"><i></i><i></i><i></i></div></div>
<span class="cnt">0/3</span><span class="exp"><span class="ic ic-down s14"></span></span>
</div>
</section>
<div class="vstack" style="padding-top: 12px">
<button class="addbig"><span class="plus">+</span>Add exercises</button>
<button class="discard">Discard workout</button>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark-hc","dark","light","light-hc"],"default":"dark-hc"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { mode: this.props.mode ?? 'dark-hc' };
  }
}
</script>
</body>
</html>
