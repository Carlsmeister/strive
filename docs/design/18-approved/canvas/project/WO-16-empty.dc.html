<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Finish with no sets</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/strive1/tokens.css">
<link rel="stylesheet" href="ds/strive1/components/bundle.css">
<link rel="stylesheet" href="moments.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div class="strive screen" data-theme="{{mode}}">
<div class="safe"></div>
<header class="wtb">
<div class="l">
<span class="ibtn plain" aria-label="Minimise workout"><span class="ic ic-down s22"></span></span>
<span class="ibtn" aria-label="Free rest"><span class="ic ic-timer s20"></span></span>
</div>
<div class="mid"><span class="wn">Workout <span class="pill" aria-label="Workout options">⋯</span></span><small>0:12</small></div>
<span class="finish">Finish</span>
</header>
<main class="body">
<section class="qs">
<span class="mark"><span class="ic ic-plus s32"></span></span>
<h2>What are you training today?</h2>
<p>Pick from the library, or tap an exercise below.</p>
<span class="btn filled">Add exercises</span>
</section>
<span class="discard">Discard workout</span>
</main>
<div class="scrim"></div>
<div class="center">
<div class="alert glass thick" role="alertdialog" aria-label="Discard the workout?">
<h2>Discard the workout?</h2>
<p>Every set in it is deleted.</p>
<div class="acts">
<a class="btn ghost" href="WO-01-none.dc.html">Cancel</a>
<a class="btn ghost err" href="Main.dc.html">Discard workout</a>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark-hc","dark","light","light-hc"],"default":"dark-hc"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { mode: this.props.mode ?? 'dark-hc' };
  }
}
</script>
</body>
</html>
